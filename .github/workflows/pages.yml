name: Pin page

# Publish release.pins from the Release workflow's build. The file is not
# stored in git and is not a GitHub Release asset. This workflow runs on
# main, which is the branch the github-pages environment allows.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: webkitgtk-android-github-pages
  cancel-in-progress: false

jobs:
  stage-pins:
    name: Stage pin page
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Choose the Release run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          id="$(gh run list --workflow release.yml --limit 30 --json databaseId,headBranch,conclusion \
            --jq '[.[] | select(.conclusion=="success" and (.headBranch|startswith("v")))][0].databaseId')"
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "No successful version-tag Release run to publish" >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Download release.pins from that build
        uses: actions/download-artifact@v5
        with:
          name: webkitgtk-android-pixie
          path: pins
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Stage release.pins
        run: |
          set -euo pipefail
          mkdir -p site
          cp pins/release.pins site/release.pins
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>webkitgtk-android</title>
          </head>
          <body>
            <h1>webkitgtk-android</h1>
            <p><a href="release.pins"><code>release.pins</code></a> names the Android <code>.pixie</code> library. <a href="https://github.com/roojs/pixie-pkg">pixie-pkg</a> reads that file and installs it.</p>
          </body>
          </html>
          EOF

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pins:
    name: Publish pin page
    needs: stage-pins
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
