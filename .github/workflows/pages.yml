name: Pin page

# Publish release.pins from the GitHub Release. The file is not stored in git.
# This workflow runs on main, which is the branch the github-pages environment allows.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: webkitgtk-android-github-pages
  cancel-in-progress: false

jobs:
  stage-pins:
    name: Stage pin page
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Download release.pins from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            tag="${{ github.event.workflow_run.head_branch }}"
            gh release download "$tag" --repo "${{ github.repository }}" --pattern release.pins --dir site
          else
            gh release download --repo "${{ github.repository }}" --pattern release.pins --dir site
          fi
          test -f site/release.pins
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>webkitgtk-android</title>
          </head>
          <body>
            <h1>webkitgtk-android</h1>
            <p><a href="release.pins"><code>release.pins</code></a> names the Android <code>.pixie</code> library. <a href="https://github.com/roojs/pixie-pkg">pixie-pkg</a> reads that file and installs it.</p>
          </body>
          </html>
          EOF

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pins:
    name: Publish pin page
    needs: stage-pins
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
