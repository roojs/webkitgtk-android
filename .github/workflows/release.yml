name: Release

# Tag push (v*) publishes a GitHub Release: the Meson wrap-file tarball and
# the Android .pixie library. workflow_dispatch builds both without publishing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Make source tarball
        id: dist
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            ver="$(sed -n "s/^[[:space:]]*version: '\\([^']*\\)'.*/\\1/p" meson.build | head -1)"
          fi
          if [[ -z "${ver}" ]]; then
            echo "could not determine version" >&2
            exit 1
          fi
          tarball="webkitgtk-android-${ver}.tar.gz"
          mkdir -p dist
          git archive --prefix="webkitgtk-android-${ver}/" HEAD | gzip -n > "dist/${tarball}"
          hash="$(sha256sum "dist/${tarball}" | awk '{ print $1 }')"
          printf '%s  %s\n' "${hash}" "${tarball}" > "dist/${tarball}.sha256"
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"
          echo "Tarball dist/${tarball}"
          echo "SHA256 ${hash}"
          ls -lh dist

      - name: Upload source tarball
        uses: actions/upload-artifact@v5
        with:
          name: webkitgtk-android-dist
          path: dist/*

  pixie:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install host build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            jq \
            ninja-build \
            pkg-config \
            python3 \
            unzip \
            valac \
            xz-utils \
            libglib2.0-dev \
            libgtk-4-dev \
            libsoup-3.0-dev

      - name: Build and pack the Android library
        run: scripts/android/build-pixie.sh

      - name: Upload pixie artifacts
        uses: actions/upload-artifact@v5
        with:
          name: webkitgtk-android-pixie
          path: pixie-artifacts/*
          if-no-files-found: error

  publish:
    needs: [tarball, pixie]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
          pattern: webkitgtk-android-*

      - name: Render release notes
        run: |
          set -euo pipefail
          ver="${GITHUB_REF#refs/tags/v}"
          tarball="webkitgtk-android-${ver}.tar.gz"
          hash="$(awk '{ print $1 }' "artifacts/${tarball}.sha256")"
          pixie="$(find artifacts -maxdepth 1 -name 'webkitgtk-android-arm-v*.pixie' -printf '%f\n')"
          if [[ -z "${hash}" || -z "${pixie}" ]]; then
            echo "missing tarball hash or pixie asset" >&2
            ls -l artifacts >&2
            exit 1
          fi
          chmod +x scripts/release/changelog.sh
          scripts/release/changelog.sh release-notes "${GITHUB_REF#refs/tags/}" -o release-notes.md
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${ver}/${tarball}"
          pixie_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${ver}/${pixie}"
          {
            echo
            echo "## Wrap pin"
            echo
            echo '```ini'
            echo '[wrap-file]'
            echo "directory = webkitgtk-android-${ver}"
            echo "source_url = ${asset_url}"
            echo "source_filename = ${tarball}"
            echo "source_hash = ${hash}"
            echo
            echo '[provide]'
            echo 'dependency_names = webkitgtk-android-1'
            echo '```'
            echo
            echo "## Pixie"
            echo
            echo "Android library: \`${pixie}\`"
            echo
            echo "\`\`\`"
            echo "${pixie_url}"
            echo "\`\`\`"
            echo
            echo "The pin list is [GitHub Pages](https://roojs.github.io/webkitgtk-android/release.pins)."
          } >> release-notes.md

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.pixie
          overwrite_files: true
